<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Notes - Uttarakhand Board</title>
<style>
:root{--bg:#0a0b14;--card:rgba(20,22,43,0.7);--card2:rgba(28,31,58,0.9);--text:#eef0ff;--muted:#8a8fb5;--accent:#7c5cff;--accent2:#00d9c0;--gold:#ffd93d;--border:rgba(255,255,255,0.08);--shadow:0 10px 40px -10px rgba(124,92,255,0.4);}
.light{--bg:#f5f6fc;--card:rgba(255,255,255,0.8);--card2:rgba(240,241,250,0.9);--text:#14162b;--muted:#6b6f8a;--border:rgba(0,0,0,0.05);--shadow:0 10px 40px -10px rgba(124,92,255,0.2);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:.35s;padding-bottom:90px;overflow-x:hidden;}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,rgba(124,92,255,0.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(0,217,192,0.12),transparent 40%);z-index:-1;pointer-events:none;}
header{position:sticky;top:0;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:100;}
header h1{font-size:1.1rem;font-weight:800;flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.icon-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.lang-bar{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto;}
.lang-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.search-wrap{padding:10px 18px 8px;}
.search-wrap input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem;outline:none;}
.progress-wrap{padding:0 18px 8px;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);}
.progress-bar{flex:1;height:5px;background:var(--card2);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .5s;}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 18px 18px;}
.subj-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 14px;cursor:pointer;transition:.3s;animation:fadeUp .5s backwards;backdrop-filter:blur(10px);}
.subj-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow);}
.subj-card .emoji{font-size:2rem;display:block;margin-bottom:8px;}
.subj-card h3{font-size:.95rem;font-weight:700;}
.subj-card p{font-size:.72rem;color:var(--muted);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.view{display:none;padding:0 18px;animation:fadeUp .4s;}
.view.active{display:block;}
.back-btn{background:var(--card2);border:1px solid var(--border);color:var(--accent2);cursor:pointer;font-size:.85rem;padding:9px 14px;font-weight:600;border-radius:10px;margin:12px 0;}
.chapter{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.25s;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(10px);}
.chapter:hover{border-color:var(--accent2);transform:translateX(5px);}
.chapter h4{font-size:.9rem;font-weight:600;flex:1;}
.content-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;line-height:1.75;backdrop-filter:blur(10px);}
.content-box h3{font-size:1rem;margin:14px 0 8px;color:var(--accent2);}
.content-box h3:first-child{margin-top:0;}
.content-box h4{font-size:.9rem;margin:10px 0 5px;color:var(--accent);}
.content-box p,.content-box li{font-size:.88rem;margin-bottom:6px;}
.content-box ul{padding-left:20px;margin-bottom:10px;}
.content-box b{color:var(--accent2);}
.content-box .tip{background:linear-gradient(135deg,rgba(255,217,61,0.15),rgba(255,217,61,0.05));border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.85rem;}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:.8rem;white-space:nowrap;font-weight:600;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.mcq{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.mcq p{font-weight:600;margin-bottom:10px;font-size:.88rem;}
.opt{padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:.85rem;background:var(--card);}
.opt.correct{background:rgba(0,184,148,0.2);border-color:#00b894;font-weight:600;}
.opt.wrong{background:rgba(255,118,117,0.2);border-color:#ff7675;}
.quiz-score{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.quiz-score h3{font-size:1.4rem;margin-bottom:6px;color:var(--accent2);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 12px;z-index:100;}
.bottom-nav button{background:none;border:none;color:var(--muted);font-size:.65rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;padding:4px 14px;}
.bottom-nav button.active{color:var(--accent2);}
.bottom-nav span:first-child{font-size:1.25rem;}
@media(min-width:600px){.subjects{grid-template-columns:repeat(3,1fr);}}
</style>
</head>

DATA.science={name:{hinglish:"Science",hindi:"विज्ञान",english:"Science"},emoji:"\uD83D\uDD2C",chapters:[
{id:"sci1",title:{hinglish:"Chemical Reactions & Equations",hindi:"रासायनिक अभिक्रियाएँ",english:"Chemical Reactions"},notes:{hinglish:"<h3>Chemical Reaction</h3><p>Jab composition badalta hai.</p><h3>4 Signs</h3><ul><li>Gas nikalna</li><li>Temperature change</li><li>Colour change</li><li>Precipitate</li></ul><h3>5 Types</h3><h4>1. Combination</h4><p>CaO + H2O -> Ca(OH)2</p><h4>2. Decomposition</h4><p>CaCO3 -> CaO + CO2</p><h4>3. Displacement</h4><p>Fe + CuSO4 -> FeSO4 + Cu</p><h4>4. Double Displacement</h4><p>AgNO3 + NaCl -> AgCl + NaNO3</p><h4>5. Redox</h4><p>Oxidation + Reduction</p><div class='tip'>OIL RIG - Oxidation Is Loss, Reduction Is Gain</div><h3>Corrosion & Rancidity</h3><p>Corrosion: rust. Rancidity: oil smell.</p>",hindi:"<h3>रासायनिक अभिक्रिया</h3><p>जब संघटन बदलता है।</p><h3>4 संकेत</h3><ul><li>गैस निकलना</li><li>तापमान परिवर्तन</li><li>रंग परिवर्तन</li><li>अवक्षेप</li></ul><h3>5 प्रकार</h3><h4>1. संयोजन</h4><p>CaO + H2O -> Ca(OH)2</p><h4>2. वियोजन</h4><p>CaCO3 -> CaO + CO2</p><h4>3. विस्थापन</h4><p>Fe + CuSO4 -> FeSO4 + Cu</p><h4>4. द्वि-विस्थापन</h4><p>AgNO3 + NaCl -> AgCl + NaNO3</p><h4>5. रेडॉक्स</h4><p>ऑक्सीकरण + अपचयन</p><div class='tip'>OIL RIG - Oxidation Is Loss, Reduction Is Gain</div><h3>संक्षारण, विकृतगंधिता</h3><p>जंग, तेल गंध।</p>",english:"<h3>Chemical Reaction</h3><p>When composition changes.</p><h3>4 Signs</h3><ul><li>Gas evolution</li><li>Temperature change</li><li>Colour change</li><li>Precipitate</li></ul><h3>5 Types</h3><h4>1. Combination</h4><p>CaO + H2O -> Ca(OH)2</p><h4>2. Decomposition</h4><p>CaCO3 -> CaO + CO2</p><h4>3. Displacement</h4><p>Fe + CuSO4 -> FeSO4 + Cu</p><h4>4. Double Displacement</h4><p>AgNO3 + NaCl -> AgCl + NaNO3</p><h4>5. Redox</h4><p>Oxidation + Reduction</p><div class='tip'>OIL RIG - Oxidation Is Loss, Reduction Is Gain</div><h3>Corrosion & Rancidity</h3><p>Rust, oil smell change.</p>"},summary:{hinglish:"5 types of reactions, oxidation-reduction, corrosion, rancidity.",hindi:"5 प्रकार, ऑक्सीकरण-अपचयन, संक्षारण।",english:"5 types, redox, corrosion, rancidity."},questions:[{q:{hinglish:"4 signs?",hindi:"4 संकेत?",english:"4 signs?"},a:{hinglish:"Gas, temp, colour, precipitate",hindi:"गैस, तापमान, रंग, अवक्षेप",english:"Gas, temp, colour, precipitate"}}],mcqs:[{q:{hinglish:"CaO+H2O->Ca(OH)2?",hindi:"CaO+H2O->Ca(OH)2?",english:"CaO+H2O->Ca(OH)2?"},opts:["Decomposition","Combination","Displacement","Redox"],ans:1}]},
{id:"sci2",title:{hinglish:"Acids, Bases & Salts",hindi:"अम्ल, क्षार एवं लवण",english:"Acids, Bases & Salts"},notes:{hinglish:"<h3>Acid</h3><p>Khatta, blue litmus red, pH<7. HCl, H2SO4</p><h3>Base</h3><p>Kadwa, red litmus blue, pH>7. NaOH</p><h3>pH Scale</h3><p>0-14. <7 acid, 7 neutral, >7 base.</p><h3>Neutralization</h3><p>HCl + NaOH -> NaCl + H2O</p>",hindi:"<h3>अम्ल</h3><p>खट्टा, नीला लिटमस लाल, pH<7।</p><h3>क्षार</h3><p>कड़वा, लाल लिटमस नीला, pH>7।</p><h3>pH स्केल</h3><p>0-14।</p><h3>उदासीनीकरण</h3><p>HCl + NaOH -> NaCl + H2O</p>",english:"<h3>Acid</h3><p>Sour, pH<7.</p><h3>Base</h3><p>Bitter, pH>7.</p><h3>pH Scale</h3><p>0-14.</p><h3>Neutralization</h3><p>HCl + NaOH -> NaCl + H2O</p>"},summary:{hinglish:"Acid-base, pH, neutralization.",hindi:"अम्ल-क्षार, pH, उदासीनीकरण।",english:"Acid-base, pH, neutralization."},questions:[{q:{hinglish:"Acid vs Base?",hindi:"अम्ल बनाम क्षार?",english:"Acid vs Base?"},a:{hinglish:"Acid pH<7, Base pH>7",hindi:"अम्ल pH<7, क्षार pH>7",english:"Acid pH<7, Base pH>7"}}],mcqs:[{q:{hinglish:"pH range?",hindi:"pH परास?",english:"pH range?"},opts:["0-7","7-14","0-14","1-10"],ans:2}]},
{id:"sci3",title:{hinglish:"Metals & Non-Metals",hindi:"धातु एवं अधातु",english:"Metals & Non-Metals"},notes:{hinglish:"<h3>Metals</h3><p>Hard, shiny, malleable, conductor. Fe, Cu, Au.</p><h3>Non-Metals</h3><p>Soft, dull, bad conductor. C, S, P.</p><h3>Reactivity</h3><p>K > Na > Ca > Mg > Al > Zn > Fe > Pb > Cu > Hg > Ag > Au</p>",hindi:"<h3>धातु</h3><p>कठोर, चमकदार, सुचालक।</p><h3>अधातु</h3><p>मुलायम, कुचालक।</p><h3>अभिक्रियाशीलता</h3><p>K > Na > Ca > Mg > Al > Zn > Fe > Pb > Cu > Hg > Ag > Au</p>",english:"<h3>Metals</h3><p>Hard, shiny, conductor.</p><h3>Non-Metals</h3><p>Soft, dull, bad conductor.</p><h3>Reactivity</h3><p>K > Na > Ca > Mg > Al > Zn > Fe > Pb > Cu > Hg > Ag > Au</p>"},summary:{hinglish:"Metal-nonmetal properties, reactivity.",hindi:"धातु-अधातु गुण।",english:"Metal-nonmetal properties, reactivity."},questions:[{q:{hinglish:"Metal + O2?",hindi:"धातु + O2?",english:"Metal + O2?"},a:{hinglish:"Basic oxide. 2Mg+O2->2MgO",hindi:"क्षारीय ऑक्साइड।",english:"Basic oxide. 2Mg+O2->2MgO"}}],mcqs:[{q:{hinglish:"Metal nahi?",hindi:"धातु नहीं?",english:"Not a metal?"},opts:["Iron","Copper","Sulphur","Gold"],ans:2}]}
]};
DATA.maths={name:{hinglish:"Maths",hindi:"गणित",english:"Maths"},emoji:"\uD83D\uDCD0",chapters:[
{id:"mat1",title:{hinglish:"Real Numbers",hindi:"वास्तविक संख्याएँ",english:"Real Numbers"},notes:{hinglish:"<h3>Real Numbers</h3><p>Rational + Irrational.</p><h3>Types</h3><ul><li>Natural: 1,2,3</li><li>Whole: 0,1,2</li><li>Integers: -1,0,1</li><li>Rational: p/q</li><li>Irrational: √2, π</li></ul><h3>Euclid Lemma</h3><p>a = bq + r, 0<=r<b</p><h3>HCF-LCM</h3><p>HCF x LCM = Product</p>",hindi:"<h3>वास्तविक संख्याएँ</h3><p>परिमेय + अपरिमेय।</p><h3>प्रकार</h3><ul><li>प्राकृत: 1,2,3</li><li>पूर्ण: 0,1,2</li><li>पूर्णांक: -1,0,1</li><li>परिमेय: p/q</li><li>अपरिमेय: √2, π</li></ul><h3>यूक्लिड</h3><p>a = bq + r</p><h3>म.स.-ल.स.</h3><p>म.स. x ल.स. = गुणनफल</p>",english:"<h3>Real Numbers</h3><p>Rational + Irrational.</p><h3>Types</h3><ul><li>Natural: 1,2,3</li><li>Whole: 0,1,2</li><li>Integers: -1,0,1</li><li>Rational: p/q</li><li>Irrational: √2, π</li></ul><h3>Euclid</h3><p>a = bq + r</p><h3>HCF-LCM</h3><p>HCF x LCM = Product</p>"},summary:{hinglish:"Euclid lemma, HCF-LCM.",hindi:"यूक्लिड, म.स.-ल.स.।",english:"Euclid lemma, HCF-LCM."},questions:[{q:{hinglish:"Euclid?",hindi:"यूक्लिड?",english:"Euclid?"},a:{hinglish:"a=bq+r, 0<=r<b",hindi:"a=bq+r, 0<=r<b",english:"a=bq+r, 0<=r<b"}}],mcqs:[{q:{hinglish:"√2?",hindi:"√2?",english:"√2?"},opts:["Rational","Irrational","Natural","Integer"],ans:1}]}
]};
DATA.sst={name:{hinglish:"SST",hindi:"सामाजिक विज्ञान",english:"SST"},emoji:"\uD83C\uDF0D",chapters:[

var curSub=null,curCh=null,curTab=0;
var bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]');
var progress=JSON.parse(localStorage.getItem('progress')||'[]');
function saveData(){localStorage.setItem('bookmarks',JSON.stringify(bookmarks));localStorage.setItem('progress',JSON.stringify(progress));updateProgress();}
function updateProgress(){var total=0,done=0;Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){total++;if(progress.indexOf(c.id)>-1)done++;});});var pct=total?Math.round((done/total)*100):0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressText').innerText=pct+'%';}
function renderSubjects(){document.getElementById('subjectGrid').innerHTML=Object.keys(DATA).map(function(k,i){return '<div class="subj-card" style="animation-delay:'+(i*0.05)+'s" onclick="openSubject(\''+k+'\')"><span class="emoji">'+DATA[k].emoji+'</span><h3>'+t(DATA[k].name)+'</h3><p>'+DATA[k].chapters.length+' chapters</p></div>';}).join('');updateProgress();}
function openSubject(k){curSub=k;document.getElementById('subjTitle').innerText=DATA[k].emoji+' '+t(DATA[k].name);document.getElementById('chapterList').innerHTML=DATA[k].chapters.map(function(c){var d=progress.indexOf(c.id)>-1;return '<div class="chapter" onclick="openChapter(\''+c.id+'\')"><h4>'+t(c.title)+'</h4>'+(d?'<span style="color:var(--accent2);">&#10004;</span>':'')+'<span>&#8594;</span></div>';}).join('');showView('subjectView');}
function openChapter(id){var ch=DATA[curSub].chapters.find(function(c){return c.id===id;});curCh=ch;document.getElementById('chapterTitle').innerText=t(ch.title);curTab=0;document.querySelectorAll('.tab').forEach(function(t2,i){t2.classList.toggle('active',i===0);});var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';if(progress.indexOf(ch.id)===-1){progress.push(ch.id);saveData();}renderTab();showView('notesView');}
function switchTab(i,el){curTab=i;document.querySelectorAll('.tab').forEach(function(t2){t2.classList.remove('active');});el.classList.add('active');renderTab();}
function renderTab(){var ch=curCh,b=document.getElementById('tabContent');
if(curTab===0){b.innerHTML='<div class="content-box">'+t(ch.notes)+'</div>';}
else if(curTab===1){b.innerHTML='<div class="content-box"><h3>Summary</h3><p>'+t(ch.summary)+'</p></div>';}
else if(curTab===2){b.innerHTML='<div class="content-box">'+(ch.questions.length?ch.questions.map(function(q,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+t(q.q)+'</p><details><summary style="color:var(--accent2);cursor:pointer;">Answer</summary><p>'+t(q.a)+'</p></details></div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===3){b.innerHTML='<div class="content-box">'+(ch.mcqs.length?ch.mcqs.map(function(m,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+t(m.q)+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="this.classList.add('+(j===m.ans?"'correct'":"'wrong'")+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('')+'</div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===4){renderQuiz();}}
function renderQuiz(){var ch=curCh,b=document.getElementById('tabContent');if(!ch.mcqs.length){b.innerHTML='<div class="content-box">Quiz jald aayega...</div>';return;}var score=0;var total=ch.mcqs.length;b.innerHTML='<div class="quiz-score"><h3>&#127942; Quiz</h3><p>'+total+' questions</p></div><div class="content-box" id="quizBox"></div>';var qb=document.getElementById('quizBox');function showQ(idx){if(idx>=total){var pct=Math.round((score/total)*100);qb.innerHTML='<div style="text-align:center;padding:20px;"><h3 style="color:var(--accent2);font-size:2rem;">'+score+'/'+total+'</h3><p style="color:var(--muted);margin:10px 0;">'+pct+'%</p><button class="back-btn" onclick="renderQuiz()">&#128260; Try Again</button></div>';return;}var m=ch.mcqs[idx];qb.innerHTML='<p style="font-weight:600;margin-bottom:12px;">Q'+(idx+1)+'. '+t(m.q)+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="checkQ(this,'+(j===m.ans)+','+idx+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('');}window.checkQ=function(el,correct,idx){el.classList.add(correct?'correct':'wrong');if(correct)score++;setTimeout(function(){showQ(idx+1);},800);};showQ(0);}
function toggleBookmark(){var ch=curCh;var idx=bookmarks.indexOf(ch.id);if(idx>-1){bookmarks.splice(idx,1);}else{bookmarks.push(ch.id);}var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';saveData();}
function showView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.remove('active');});if(id==='home')document.getElementById('navHome').classList.add('active');if(id==='bookmarksView')document.getElementById('navSaved').classList.add('active');}
function goHome(){showView('home');}
function goBack(){curSub?openSubject(curSub):goHome();}
function showBookmarks(){var list=document.getElementById('bookmarksList');if(!bookmarks.length){list.innerHTML='<p style="text-align:center;color:var(--muted);padding:20px;">Kuch save nahi kiya</p>';}else{var html='';Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(bookmarks.indexOf(c.id)>-1){html+='<div class="chapter" onclick="openSubject(\''+k+'\');setTimeout(function(){openChapter(\''+c.id+'\');},100)"><h4>'+t(c.title)+'</h4><span>'+DATA[k].emoji+'</span></div>';}});});list.innerHTML=html;}showView('bookmarksView');}
function search(){var q=document.getElementById('searchBox').value.toLowerCase();if(!q){renderSubjects();return;}var g=document.getElementById('subjectGrid');var r=[];Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(t(c.title).toLowerCase().indexOf(q)>-1)r.push({s:k,c:c});});});g.innerHTML=r.length?r.map(function(x){return '<div class="subj-card" onclick="openSubject(\''+x.s+'\');setTimeout(function(){openChapter(\''+x.c.id+'\');},100)"><span class="emoji">'+DATA[x.s].emoji+'</span><h3>'+t(x.c.title)+'</h3><p>'+t(DATA[x.s].name)+'</p></div>';}).join(''):'<p style="text-align:center;color:var(--muted);padding:20px;">Kuch nahi mila</p>';}
function setLang(l,el){LANG=l;document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');renderSubjects();if(curSub)openSubject(curSub);if(curCh)renderTab();}
renderSubjects();
</script>
