<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Notes - Uttarakhand Board</title>
<style>
:root{--bg:#0a0b14;--card:rgba(20,22,43,0.7);--card2:rgba(28,31,58,0.9);--text:#eef0ff;--muted:#8a8fb5;--accent:#7c5cff;--accent2:#00d9c0;--gold:#ffd93d;--border:rgba(255,255,255,0.08);--shadow:0 10px 40px -10px rgba(124,92,255,0.4);}
.light{--bg:#f5f6fc;--card:rgba(255,255,255,0.8);--card2:rgba(240,241,250,0.9);--text:#14162b;--muted:#6b6f8a;--border:rgba(0,0,0,0.05);--shadow:0 10px 40px -10px rgba(124,92,255,0.2);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:.35s;padding-bottom:90px;overflow-x:hidden;}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,rgba(124,92,255,0.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(0,217,192,0.12),transparent 40%);z-index:-1;pointer-events:none;}
header{position:sticky;top:0;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:12px;z-index:100;}
header h1{font-size:1.25rem;font-weight:800;flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px;}
.icon-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:1.2rem;transition:.2s;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--accent);transform:scale(1.05);}
.search-wrap{padding:16px 20px 8px;}
.search-wrap input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;outline:none;transition:.2s;backdrop-filter:blur(10px);}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,0.15);}
.progress-wrap{padding:0 20px 10px;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);}
.progress-bar{flex:1;height:6px;background:var(--card2);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .5s ease;}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 20px 20px;}
.subj-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 18px;cursor:pointer;transition:.3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;animation:fadeUp .5s backwards;backdrop-filter:blur(10px);}
.subj-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:.3s;}
.subj-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:var(--shadow);}
.subj-card:hover::before{opacity:1;}
.subj-card .emoji{font-size:2.4rem;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(124,92,255,0.3));}
.subj-card h3{font-size:1.05rem;font-weight:700;margin-bottom:4px;letter-spacing:-.3px;}
.subj-card p{font-size:.78rem;color:var(--muted);font-weight:500;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.view{display:none;padding:0 20px;animation:fadeUp .4s;}
.view.active{display:block;}
.back-btn{background:var(--card2);border:1px solid var(--border);color:var(--accent2);cursor:pointer;font-size:.88rem;padding:10px 16px;font-weight:600;border-radius:12px;margin:14px 0;transition:.2s;display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{border-color:var(--accent2);transform:translateX(-3px);}
.chapter{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;transition:.25s;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(10px);}
.chapter:hover{border-color:var(--accent2);transform:translateX(6px);box-shadow:0 8px 25px -10px rgba(0,217,192,0.3);}
.chapter h4{font-size:.98rem;font-weight:600;flex:1;}
.chapter .num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;}
.bookmark-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:4px;transition:.2s;}
.bookmark-btn:hover{transform:scale(1.2);}
.content-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px;line-height:1.75;backdrop-filter:blur(10px);}
.content-box h3{font-size:1.05rem;margin:16px 0 10px;color:var(--accent2);font-weight:700;display:flex;align-items:center;gap:8px;}
.content-box h3:first-child{margin-top:0;}
.content-box h4{font-size:.95rem;margin:12px 0 6px;color:var(--accent);font-weight:600;}
.content-box p,.content-box li{font-size:.93rem;margin-bottom:8px;}
.content-box ul{padding-left:22px;margin-bottom:12px;}
.content-box li{margin-bottom:6px;}
.content-box b,.content-box strong{color:var(--accent2);font-weight:700;}
.content-box .tip{background:linear-gradient(135deg,rgba(255,217,61,0.15),rgba(255,217,61,0.05));border-left:3px solid var(--gold);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.88rem;}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:12px;cursor:pointer;font-size:.85rem;white-space:nowrap;font-weight:600;transition:.25s;}
.tab:hover{color:var(--text);border-color:var(--accent);}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 20px -8px var(--accent);}
.mcq{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);}
.mcq p{font-weight:600;margin-bottom:12px;font-size:.93rem;line-height:1.5;}
.opt{padding:11px 14px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;font-size:.88rem;transition:.2s;background:var(--card);}
.opt:hover{border-color:var(--accent);transform:translateX(4px);}
.opt.correct{background:rgba(0,184,148,0.2);border-color:#00b894;font-weight:600;}
.opt.wrong{background:rgba(255,118,117,0.2);border-color:#ff7675;}
.quiz-score{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;}
.quiz-score h3{font-size:1.5rem;margin-bottom:8px;color:var(--accent2);}
.quiz-score p{color:var(--muted);font-size:.9rem;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 12px;z-index:100;}
.bottom-nav button{background:none;border:none;color:var(--muted);font-size:.68rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;padding:4px 16px;border-radius:10px;transition:.2s;}
.bottom-nav button.active{color:var(--accent2);}
.bottom-nav button:hover{color:var(--text);}
.bottom-nav span:first-child{font-size:1.35rem;}
@media(min-width:600px){.subjects{grid-template-columns:repeat(3,1fr);}.subj-card .emoji{font-size:2.8rem;}}
</style>
</head>

var DATA = {
science:{name:"Science",emoji:"\uD83D\uDD2C",chapters:[
{id:"sci1",title:"Chemical Reactions & Equations",notes:"<h3>&#128293; Chemical Reaction Kya Hai?</h3><p>Jab kisi substance ka <b>chemical composition badal jata hai</b>, use chemical reaction kehte hain. Jaise dudh se dahi banna, loha mein rust lagna.</p><h3>&#128200; Reaction Ke 4 Signs</h3><ul><li><b>Gas nikalna</b> - bubbles dikhna</li><li><b>Temperature change</b> - garam ya thanda hona</li><li><b>Colour change</b> - rang badalna</li><li><b>Precipitate</b> - neeche solid jamna</li></ul><h3>&#128218; 5 Types of Reactions</h3><h4>1. Combination Reaction</h4><p>Do ya zyada substances mil kar <b>ek naya product</b> banate hain.</p><p><b>Example:</b> CaO + H&#8322;O &#8594; Ca(OH)&#8322;</p><h4>2. Decomposition Reaction</h4><p>Ek compound <b>toot kar do ya zyada</b> substances banata hai.</p><p><b>Example:</b> CaCO&#8323; &#8594; CaO + CO&#8322;</p><h4>3. Displacement Reaction</h4><p><b>Zyada reactive</b> element, kam reactive element ko uski jagah se hataata hai.</p><p><b>Example:</b> Fe + CuSO&#8324; &#8594; FeSO&#8324; + Cu</p><h4>4. Double Displacement</h4><p>Do compounds ke beech <b>ion exchange</b> hota hai.</p><p><b>Example:</b> AgNO&#8323; + NaCl &#8594; AgCl + NaNO&#8323;</p><h4>5. Redox Reaction</h4><p>Jisme <b>oxidation aur reduction dono</b> saath hote hain.</p><h3>&#9878;&#65039; Oxidation vs Reduction</h3><ul><li><b>Oxidation:</b> Oxygen ka addition ya Hydrogen ka removal</li><li><b>Reduction:</b> Hydrogen ka addition ya Oxygen ka removal</li></ul><div class='tip'>&#128161; <b>Yaad rakho:</b> OIL RIG - Oxidation Is Loss, Reduction Is Gain (electrons ka)</div><h3>&#128679; Corrosion</h3><p>Metal ke surface par <b>layer banna</b> (jaise iron par rust). Ye oxygen aur moisture ki wajah se hota hai.</p><h3>&#127858; Rancidity</h3><p>Fats/oil ka <b>oxidise ho kar smell badalna</b>. Isse rokne ke liye nitrogen gas ya antioxidants use karte hain.</p>",summary:"Is chapter mein hum seekhte hain ki chemical reactions kya hote hain, unke 5 types (Combination, Decomposition, Displacement, Double Displacement, Redox), oxidation-reduction ka concept, corrosion aur rancidity. Board exam ke liye <b>reaction equations likhna</b> zaroor seekho - ye 5 marks ka aata hai!",questions:[{q:"Chemical reaction ke 4 signs likho.",a:"1. Gas ka nikalna 2. Temperature change 3. Colour change 4. Precipitate banna"},{q:"Combination aur Decomposition reaction mein difference batao.",a:"Combination mein do substances milkar ek bante hain (CaO + H2O -> Ca(OH)2). Decomposition mein ek toot kar do ya zyada bante hain (CaCO3 -> CaO + CO2)."},{q:"Oxidation aur Reduction define karo.",a:"Oxidation: Oxygen ka addition ya Hydrogen ka removal. Reduction: Hydrogen ka addition ya Oxygen ka removal."},{q:"Corrosion kya hai? Example do.",a:"Metal par layer banna. Jaise iron par rust (Fe2O3.xH2O) banna, silver par black layer aana."},{q:"Rancidity rokne ke 3 tarike batao.",a:"1. Nitrogen gas bhar kar 2. Antioxidants mila kar 3. Fridge mein rakh kar 4. Air-tight packing"}],mcqs:[{q:"CaO + H2O -> Ca(OH)2 kaun sa reaction hai?",opts:["Decomposition","Combination","Displacement","Redox"],ans:1},{q:"Redox reaction mein kya hota hai?",opts:["Sirf oxidation","Sirf reduction","Oxidation + Reduction dono","Kuch nahi"],ans:2},{q:"Rancidity rokne ke liye kya use karte hain?",opts:["Oxygen","Nitrogen","Hydrogen","CO2"],ans:1},{q:"Iron par rust kaun sa compound hai?",opts:["FeO","Fe2O3.xH2O","Fe3O4","FeCl3"],ans:1}]},
{id:"sci2",title:"Acids, Bases & Salts",notes:"<h3>&#129514; Acid Kya Hai?</h3><p>Wo substances jo <b>sour (khatta)</b> hote hain aur blue litmus ko red karte hain. Example: Lemon juice, Vinegar, HCl</p><h3>&#129521; Base Kya Hai?</h3><p>Wo substances jo <b>bitter (kadwa)</b> hote hain aur red litmus ko blue karte hain. Example: Soap, Lime water, NaOH</p><h3>&#128207; pH Scale</h3><p>pH scale <b>0 se 14</b> tak hota hai:</p><ul><li><b>pH < 7</b> - Acidic (khatta)</li><li><b>pH = 7</b> - Neutral (paani)</li><li><b>pH > 7</b> - Basic (kadwa)</li></ul><div class='tip'>&#128161; <b>Yaad rakho:</b> Har ek pH ka change 10x strength ka difference hota hai!</div><h3>&#129514; Important Acids</h3><ul><li><b>HCl</b> - Hydrochloric acid (pet mein)</li><li><b>H2SO4</b> - Sulphuric acid (car battery)</li><li><b>HNO3</b> - Nitric acid</li><li><b>CH3COOH</b> - Acetic acid (vinegar)</li><li><b>H2CO3</b> - Carbonic acid (soda)</li></ul><h3>&#129521; Important Bases</h3><ul><li><b>NaOH</b> - Sodium hydroxide (soap)</li><li><b>KOH</b> - Potassium hydroxide</li><li><b>Ca(OH)2</b> - Calcium hydroxide (chuna)</li><li><b>NH4OH</b> - Ammonium hydroxide</li></ul><h3>&#9879;&#65039; Neutralization Reaction</h3><p>Acid + Base &#8594; Salt + Water</p><p><b>Example:</b> HCl + NaOH &#8594; NaCl + H2O</p><h3>&#129514; Acid + Metal</h3><p>Acid + Metal &#8594; Salt + Hydrogen gas</p><p><b>Example:</b> Zn + H2SO4 &#8594; ZnSO4 + H2</p>",summary:"Acids, bases aur salts ka chapter bahut important hai. Yahan hum seekhte hain acid-base ka difference, pH scale, neutralization reaction, aur inke real-life uses. Topper banne ke liye pH scale aur important reactions yaad rakho.",questions:[{q:"Acid aur Base mein difference batao.",a:"Acid khatta hota hai, blue litmus ko red karta hai, pH<7. Base kadwa hota hai, red litmus ko blue karta hai, pH>7."},{q:"pH scale kya hai? Kitna hota hai?",a:"pH scale 0 se 14 tak hota hai. pH<7 acidic, pH=7 neutral, pH>7 basic."},{q:"Neutralization reaction kya hai? Example do.",a:"Acid + Base -> Salt + Water. Example: HCl + NaOH -> NaCl + H2O"},{q:"Acid + Metal reaction mein kya banta hai?",a:"Salt + Hydrogen gas banta hai. Example: Zn + H2SO4 -> ZnSO4 + H2"},{q:"3 important acids ke naam aur formula batao.",a:"HCl (Hydrochloric), H2SO4 (Sulphuric), HNO3 (Nitric)"}],mcqs:[{q:"pH scale ka range kya hai?",opts:["0-7","7-14","0-14","1-10"],ans:2},{q:"Lemon juice ka pH kya hoga?",opts:["pH<7","pH=7","pH>7","pH=14"],ans:0},{q:"Neutralization reaction mein kya banta hai?",opts:["Sirf Salt","Sirf Water","Salt + Water","Gas"],ans:2},{q:"Blue litmus ko red kaun karta hai?",opts:["Base","Acid","Salt","Water"],ans:1}]},
{id:"sci3",title:"Metals & Non-Metals",notes:"<h3>&#128142; Metals</h3><p>Wo elements jo <b>hard, shiny, malleable, ductile</b> hote hain aur <b>heat + electricity</b> ke good conductor hote hain. Example: Iron, Copper, Gold, Silver.</p><h4>Properties of Metals</h4><ul><li><b>Malleable</b> - hammer se thin sheets ban sakti hain</li><li><b>Ductile</b> - wires ban sakti hain</li><li><b>Sonorous</b> - bell jaisi sound</li><li><b>Good conductor</b> - heat aur electricity ke</li><li><b>Lustrous</b> - shiny surface</li></ul><h3>&#127794; Non-Metals</h3><p>Wo elements jo <b>soft, dull, brittle</b> hote hain aur <b>heat + electricity ke bad conductor</b> hote hain (except graphite). Example: Carbon, Sulphur, Phosphorus, Oxygen.</p><h3>&#128293; Reaction with Oxygen</h3><p>Metal + Oxygen &#8594; Metal Oxide (basic)</p><p>Example: 2Mg + O2 &#8594; 2MgO</p><p>Non-Metal + Oxygen &#8594; Non-Metal Oxide (acidic)</p><p>Example: C + O2 &#8594; CO2</p><h3>&#128167; Reaction with Water</h3><ul><li>Metals like Na, K - paani se violent reaction</li><li>Metals like Fe, Zn - steam se reaction</li><li>Metals like Cu, Ag, Au - koi reaction nahi</li></ul><h3>&#129514; Reaction with Acids</h3><p>Metal + Acid &#8594; Salt + Hydrogen</p><p>Example: Mg + 2HCl &#8594; MgCl2 + H2</p><h3>&#129529; Reactivity Series</h3><p>K &gt; Na &gt; Ca &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Pb &gt; Cu &gt; Hg &gt; Ag &gt; Au</p><div class='tip'>&#128161; <b>Yaad rakho:</b> Jo metal series mein upar hai wo neeche wale ko replace kar sakta hai!</div>",summary:"Metals aur Non-Metals ke properties, reactions (oxygen, water, acid ke saath), reactivity series aur ionic compounds ka formation. Topper banne ke liye reactivity series aur reactions yaad karo.",questions:[{q:"Metals ke 5 properties batao.",a:"1. Malleable 2. Ductile 3. Sonorous 4. Good conductor 5. Lustrous"},{q:"Metal + Oxygen reaction ka product kya hota hai?",a:"Metal Oxide banta hai jo basic hota hai. Example: 2Mg + O2 -> 2MgO"},{q:"Reactivity series kya hai?",a:"Metals ka arrangement jisme zyada reactive upar aur kam reactive neeche. K > Na > Ca > Mg > Al > Zn > Fe > Pb > Cu > Hg > Ag > Au"},{q:"Aqua regia kya hai?",a:"3:1 ratio mein HCl aur HNO3 ka mixture. Ye gold aur silver ko dissolve kar sakta hai."},{q:"Non-metals ke 3 examples do.",a:"Carbon, Sulphur, Phosphorus (ya Oxygen, Nitrogen)"}],mcqs:[{q:"Nimnalikhit mein kaun sa metal nahi hai?",opts:["Iron","Copper","Sulphur","Gold"],ans:2},{q:"Metal + Oxygen se kya banta hai?",opts:["Acidic oxide","Basic oxide","Neutral oxide","Salt"],ans:1},{q:"Reactivity series mein sabse upar kaun hai?",opts:["Gold","Potassium","Iron","Copper"],ans:1},{q:"Graphite kis type ka conductor hai?",opts:["Heat ka","Electricity ka","Dono ka","Koi nahi"],ans:2}]}
]},
maths:{name:"Maths",emoji:"\uD83D\uDCD0",chapters:[
{id:"mat1",title:"Real Numbers",notes:"<h3>&#128290; Real Numbers Kya Hain?</h3><p>Wo saare numbers jo number line par dikhaye ja sakte hain - <b>Rational + Irrational</b> dono milkar Real Numbers banate hain.</p><h3>&#128208; Types of Numbers</h3><ul><li><b>Natural Numbers (N):</b> 1, 2, 3, 4...</li><li><b>Whole Numbers (W):</b> 0, 1, 2, 3...</li><li><b>Integers (Z):</b> ...-2, -1, 0, 1, 2...</li><li><b>Rational (Q):</b> p/q form mein (q&ne;0). Jaise 3/4</li><li><b>Irrational:</b> p/q form mein nahi. Jaise &radic;2, &pi;</li></ul><h3>&#128200; Euclid's Division Lemma</h3><p><b>a = bq + r</b> jahan 0 &le; r &lt; b</p><p>Example: 15 = 4&times;3 + 3</p><h3>&#128290; Fundamental Theorem of Arithmetic</h3><p>Har composite number ko <b>prime factors</b> ke product ke roop mein likha ja sakta hai, aur ye unique hota hai.</p><p>Example: 60 = 2&sup2; &times; 3 &times; 5</p><h3>&#128290; HCF aur LCM</h3><ul><li><b>HCF:</b> Highest Common Factor - sabse bada common divisor</li><li><b>LCM:</b> Lowest Common Multiple - sabse chhota common multiple</li><li><b>Formula:</b> HCF &times; LCM = Product of two numbers</li></ul><div class='tip'>&#128161; <b>Topper Tip:</b> HCF nikalne ke liye prime factorization karo, phir common primes ka <b>minimum power</b> lo. LCM ke liye <b>maximum power</b> lo.</div>",summary:"Real Numbers chapter mein hum seekhte hain Euclid's Division Lemma, Fundamental Theorem of Arithmetic, HCF, LCM aur irrational numbers ka concept. Board mein 5-6 marks ka aata hai.",questions:[{q:"Euclid's Division Lemma likho.",a:"a = bq + r, jahan 0 <= r < b"},{q:"Rational aur Irrational number mein difference batao.",a:"Rational number p/q form mein likha ja sakta hai (q≠0). Irrational nahi likha ja sakta. Example: 3/4 rational, √2 irrational."},{q:"HCF aur LCM ka formula batao.",a:"HCF × LCM = Product of two numbers"},{q:"Fundamental Theorem of Arithmetic kya hai?",a:"Har composite number ko prime factors ke product ke roop mein uniquely likha ja sakta hai."}],mcqs:[{q:"√2 kaun sa number hai?",opts:["Rational","Irrational","Natural","Integer"],ans:1},{q:"HCF(12, 18) kya hai?",opts:["2","3","6","36"],ans:2},{q:"LCM(12, 18) kya hai?",opts:["36","6","72","216"],ans:0},{q:"Euclid's lemma mein a = ?",opts:["bq + r","bq - r","b + qr","bqr"],ans:0}]}
]},
sst:{name:"SST",emoji:"\uD83C\uDF0D",chapters:[
{id:"sst1",title:"Nationalism in Europe",notes:"<h3>&#127757; Nationalism Kya Hai?</h3><p>Apne <b>nation</b> ke prati loyalty aur pyar ki feeling. 19th century mein Europe mein nationalism ka uday hua.</p><h3>&#127467;&#127479; French Revolution (1789)</h3><p>France mein pehli baar <b>nation-state</b> ka concept aaya. La Patrie (fatherland) aur citoyen (citizen) ke ideas aaye.</p><h3>&#127470;&#127481; Italy ka Unification</h3><ul><li><b>Giuseppe Mazzini</b> - Young Italy ka founder</li><li><b>Count Cavour</b> - Prime Minister, diplomat</li><li><b>Giuseppe Garibaldi</b> - Armed volunteers ke leader</li><li><b>Victor Emmanuel II</b> - First King of unified Italy (1861)</li></ul><h3>&#127465;&#127466; Germany ka Unification</h3><ul><li><b>Otto von Bismarck</b> - Iron Chancellor</li><li>Blood and Iron policy</li><li>3 wars: Denmark, Austria, France</li><li>1871 mein German Empire bana, Kaiser William I king bana</li></ul><h3>&#127468;&#127463; Britain mein Nationalism</h3><p>England + Scotland + Wales + Ireland milkar United Kingdom bana. 1707 mein Act of Union se England-Scotland juda.</p><h3>&#127470;&#127466; Ireland ki Problem</h3><p>1845 mein Potato Famine hua. Irish log British rule ke khilaaf ho gaye.</p>",summary:"Nationalism in Europe chapter mein French Revolution, Italy aur Germany ka unification, Britain ka nationalism aur Balkans ki problem discuss karte hain. Board ke liye dates aur leaders yaad karo.",questions:[{q:"French Revolution ka kya role tha nationalism mein?",a:"France mein pehli baar nation-state ka concept aaya. La Patrie aur citoyen ke ideas aaye jo nationalism ko spread kiya."},{q:"Italy ke unification mein kaun-kaun the?",a:"Giuseppe Mazzini (Young Italy), Count Cavour (PM), Giuseppe Garibaldi (military), Victor Emmanuel II (King)"},{q:"Germany ke unification ke baare mein batao.",a:"Otto von Bismarck ne Blood and Iron policy se 3 wars (Denmark, Austria, France) jeete. 1871 mein German Empire bana."},{q:"Ireland mein kya problem thi?",a:"1845 mein Potato Famine hua. Irish log British rule ke khilaaf ho gaye."}],mcqs:[{q:"Young Italy ka founder kaun tha?",opts:["Garibaldi","Mazzini","Cavour","Bismarck"],ans:1},{q:"Germany ka unification kis ne kiya?",opts:["Mazzini","Bismarck","Cavour","Napoleon"],ans:1},{q:"Italy ka unification kab hua?",opts:["1861","1871","1789","1848"],ans:0},{q:"Blood and Iron policy kis ki thi?",opts:["Mazzini","Bismarck","Garibaldi","Cavour"],ans:1}]}

{id:"eng1",title:"A Letter to God",notes:"<h3>&#128220; About the Story</h3><p><b>Author:</b> G.L. Fuentes</p><p><b>Theme:</b> Faith, humanity, kindness</p><h3>&#128221; Summary</h3><p>Lencho ek <b>poor farmer</b> tha. Uska khet barbaad ho gaya hailstone se. Usne 100 pesos ki demand ke saath <b>God ko letter likha</b>. Postmaster ne ye dekha toh usne apne employees se paisa collect kiya aur 70 pesos bheja.</p><p>Lencho ne paisa ginte hi fir se God ko letter likha ki <b>30 pesos kam hai</b> aur post office walon ne chori ki hai.</p><h3>&#127775; Characters</h3><ul><li><b>Lencho:</b> Simple, hardworking, God pe poora bharosa</li><li><b>Postmaster:</b> Kind, helpful, generous</li></ul><h3>&#128161; Theme & Message</h3><p>Faith kabhi kam nahi hoti. Humanity aur kindness sabse badi cheez hai.</p>",summary:"A Letter to God story mein Lencho ki faith aur postmaster ki kindness dikhayi gayi hai. Board exam ke liye characters aur theme yaad karo.",questions:[{q:"Lencho kaun tha?",a:"Ek poor farmer jo God pe poora bharosa rakhta tha."},{q:"Postmaster ne kya kiya?",a:"Usne apne employees se paisa collect karke Lencho ko 70 pesos bheja."},{q:"Lencho ne dusra letter kyun likha?",a:"Kyunki 30 pesos kam the aur usne socha post office walon ne chori kar li."}],mcqs:[{q:"Lencho ne kitne pesos maange the?",opts:["50","100","200","70"],ans:1},{q:"Postmaster ne kitne bheje?",opts:["100","70","30","50"],ans:1},{q:"Lencho ka kya kaam tha?",opts:["Teacher","Farmer","Postmaster","Doctor"],ans:1}]}

{id:"hin1",title:"Surdas Ke Pad",notes:"<h3>&#128220; Kavya Kya Hai?</h3><p><b>Kavi:</b> Surdas</p><p><b>Bhasha:</b> Braj Bhasha</p><h3>&#128221; Pad 1 - Gopiyon ka Varnan</h3><p>Surdas ji ne Gopiyon ke <b>saundarya</b> ka varnan kiya hai. Unki aankhein, unka roop, unka hasna - sab kuch bahut sundar hai.</p><h3>&#128221; Pad 2 - Krishna ka Varnan</h3><p>Krishna ke <b>bal roop</b> ka varnan. Unke nayan, unki muskan, unki chanchalta.</p><h3>&#127775; Bhav</h3><ul><li><b>Pad 1:</b> Gopiyon ka saundarya varnan</li><li><b>Pad 2:</b> Krishna ka bal leela varnan</li></ul><h3>&#128161; Message</h3><p>Surdas ji ne <b>Bhakti bhav</b> ko darshaya hai. Krishna ke prati unki gehri bhakti dikhayi gayi hai.</p>",summary:"Surdas ke pad mein Gopiyon aur Krishna ka varnan hai. Bhakti bhav aur Braj bhasha ki sundarta is pad ki visheshta hai.",questions:[{q:"Surdas ki bhasha kaun si thi?",a:"Braj Bhasha"},{q:"Surdas ke pad mein kya varnit hai?",a:"Gopiyon aur Krishna ka saundarya varnan."},{q:"Surdas ke pad ka mool bhav kya hai?",a:"Bhakti bhav - Krishna ke prati prem aur samarpan."}],mcqs:[{q:"Surdas ki bhasha kaun si hai?",opts:["Avadhi","Braj","Bhojpuri","Maithili"],ans:1},{q:"Surdas kis ke bhakti karte the?",opts:["Ram","Shiva","Krishna","Durga"],ans:2},{q:"Surdas ke pad mein kya varnan hai?",opts:["Yuddh","Saundarya","Daan","Rajya"],ans:1}]}

{id:"san1",title:"Shrimad Bhagavad Gita",notes:"<h3>&#128220; Gita Kya Hai?</h3><p>Shrimad Bhagavad Gita <b>Mahabharata</b> ka ek hissa hai. Isme <b>18 adhyay</b> hain aur <b>700 shlok</b> hain.</p><h3>&#128221; Gita ka Sandesh</h3><ul><li><b>Karma Yoga:</b> Karm karo, phal ki chinta mat karo</li><li><b>Bhakti Yoga:</b> Bhagwan ki bhakti karo</li><li><b>Gyan Yoga:</b> Gyan prapt karo</li></ul><h3>&#127775; Important Shlok</h3><p><b>Shlok:</b> कर्मण्येवाधिकारस्ते मा फलेषु कदाचन</p><p><b>Arth:</b> Tumhara adhikar sirf karm karne mein hai, phal mein nahi.</p>",summary:"Shrimad Bhagavad Gita mein 18 adhyay aur 700 shlok hain. Isme Karma Yoga, Bhakti Yoga aur Gyan Yoga ka sandesh diya gaya hai. Board exam ke liye important shlok aur unke arth yaad karo.",questions:[{q:"Bhagavad Gita mein kitne adhyay hain?",a:"18 adhyay"},{q:"Gita mein kitne shlok hain?",a:"700 shlok"},{q:"Gita ka mool sandesh kya hai?",a:"Karm karo, phal ki chinta mat karo."}],mcqs:[{q:"Gita mein kitne adhyay hain?",opts:["16","17","18","19"],ans:2},{q:"Gita kis granth ka hissa hai?",opts:["Ramayan","Mahabharata","Ved","Puran"],ans:1},{q:"Gita mein kitne shlok hain?",opts:["500","700","800","1000"],ans:1}]}

var curSub=null,curCh=null,curTab=0;
var bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
var progress = JSON.parse(localStorage.getItem('progress') || '[]');
function saveData(){localStorage.setItem('bookmarks', JSON.stringify(bookmarks));localStorage.setItem('progress', JSON.stringify(progress));updateProgress();}
function updateProgress(){var total=0, done=0;Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){total++;if(progress.indexOf(c.id)>-1)done++;});});var pct=total?Math.round((done/total)*100):0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressText').innerText=pct+'%';}
function renderSubjects(){document.getElementById('subjectGrid').innerHTML=Object.keys(DATA).map(function(k,i){return '<div class="subj-card" style="animation-delay:'+(i*0.05)+'s" onclick="openSubject(\''+k+'\')"><span class="emoji">'+DATA[k].emoji+'</span><h3>'+DATA[k].name+'</h3><p>'+DATA[k].chapters.length+' chapters</p></div>';}).join('');updateProgress();}
function openSubject(k){curSub=k;document.getElementById('subjTitle').innerText=DATA[k].emoji+" "+DATA[k].name;document.getElementById('chapterList').innerHTML=DATA[k].chapters.map(function(c){var isB=bookmarks.indexOf(c.id)>-1;var isDone=progress.indexOf(c.id)>-1;return '<div class="chapter" onclick="openChapter(\''+c.id+'\')"><h4>'+c.title+'</h4>'+(isDone?'<span style="color:var(--accent2);font-size:1.2rem;">&#10004;</span>':'')+'<span>&#8594;</span></div>';}).join('');showView('subjectView');}
function openChapter(id){var ch=DATA[curSub].chapters.find(function(c){return c.id===id;});curCh=ch;document.getElementById('chapterTitle').innerText=ch.title;curTab=0;document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===0);});var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';if(progress.indexOf(ch.id)===-1){progress.push(ch.id);saveData();}renderTab();showView('notesView');}
function switchTab(i,el){curTab=i;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');renderTab();}
function renderTab(){var ch=curCh,b=document.getElementById('tabContent');
if(curTab===0){b.innerHTML='<div class="content-box">'+ch.notes+'</div>';}
else if(curTab===1){b.innerHTML='<div class="content-box"><h3>Summary</h3><p>'+ch.summary+'</p></div>';}
else if(curTab===2){b.innerHTML='<div class="content-box">'+(ch.questions.length?ch.questions.map(function(q,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+q.q+'</p><details><summary style="color:#00cec9;cursor:pointer;">Answer</summary><p>'+q.a+'</p></details></div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===3){b.innerHTML='<div class="content-box">'+(ch.mcqs.length?ch.mcqs.map(function(m,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+m.q+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="this.classList.add('+(j===m.ans?"'correct'":"'wrong'")+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('')+'</div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===4){renderQuiz();}}
function renderQuiz(){var ch=curCh,b=document.getElementById('tabContent');if(!ch.mcqs.length){b.innerHTML='<div class="content-box">Quiz jald aayega...</div>';return;}var score=0;var total=ch.mcqs.length;var answers=[];b.innerHTML='<div class="quiz-score"><h3>&#127942; Quiz Mode</h3><p>'+total+' questions - apna score check karo!</p></div><div class="content-box" id="quizBox"></div>';var qb=document.getElementById('quizBox');function showQ(idx){if(idx>=total){var pct=Math.round((score/total)*100);qb.innerHTML='<div style="text-align:center;padding:20px;"><h3 style="color:var(--accent2);font-size:2rem;">'+score+'/'+total+'</h3><p style="color:var(--muted);margin:10px 0;">'+pct+'% Correct</p><button class="back-btn" onclick="renderQuiz()" style="margin-top:10px;">&#128260; Dobara Try Karo</button></div>';return;}var m=ch.mcqs[idx];qb.innerHTML='<p style="font-weight:600;margin-bottom:12px;">Q'+(idx+1)+'. '+m.q+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="checkQ(this,'+(j===m.ans)+','+idx+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('');}window.checkQ=function(el,correct,idx){el.classList.add(correct?'correct':'wrong');if(correct)score++;setTimeout(function(){showQ(idx+1);},800);};showQ(0);}
function toggleBookmark(){var ch=curCh;var idx=bookmarks.indexOf(ch.id);if(idx>-1){bookmarks.splice(idx,1);}else{bookmarks.push(ch.id);}var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';saveData();}
function showView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.remove('active');});if(id==='home')document.getElementById('navHome').classList.add('active');if(id==='bookmarksView')document.getElementById('navSaved').classList.add('active');}
function goHome(){showView('home');}
function goBack(){curSub?openSubject(curSub):goHome();}
function showBookmarks(){var list=document.getElementById('bookmarksList');if(!bookmarks.length){list.innerHTML='<p style="text-align:center;color:var(--muted);padding:20px;">Abhi tak kuch save nahi kiya. &#128278;</p>';}else{var html='';Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(bookmarks.indexOf(c.id)>-1){html+='<div class="chapter" onclick="openSubject(\''+k+'\');setTimeout(function(){openChapter(\''+c.id+'\');},100)"><h4>'+c.title+'</h4><span>'+DATA[k].emoji+'</span></div>';}});});list.innerHTML=html;}showView('bookmarksView');}
function search(){var q=document.getElementById('searchBox').value.toLowerCase();if(!q){renderSubjects();return;}var g=document.getElementById('subjectGrid');var r=[];Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(c.title.toLowerCase().indexOf(q)>-1)r.push({s:k,c:c});});});g.innerHTML=r.length?r.map(function(x){return '<div class="subj-card" onclick="openSubject(\''+x.s+'\');setTimeout(function(){openChapter(\''+x.c.id+'\');},100)"><span class="emoji">'+DATA[x.s].emoji+'</span><h3>'+x.c.title+'</h3><p>'+DATA[x.s].name+'</p></div>';}).join(''):'<p style="text-align:center;color:var(--muted);padding:20px;">Kuch nahi mila &#128533;</p>';}
function toggleTheme(){document.body.classList.toggle('light');}
renderSubjects();
</script>
