<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Notes - Uttarakhand Board</title>
<style>
:root{--bg:#0a0b14;--card:rgba(20,22,43,0.7);--card2:rgba(28,31,58,0.9);--text:#eef0ff;--muted:#8a8fb5;--accent:#7c5cff;--accent2:#00d9c0;--gold:#ffd93d;--border:rgba(255,255,255,0.08);--shadow:0 10px 40px -10px rgba(124,92,255,0.4);}
.light{--bg:#f5f6fc;--card:rgba(255,255,255,0.8);--card2:rgba(240,241,250,0.9);--text:#14162b;--muted:#6b6f8a;--border:rgba(0,0,0,0.05);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,rgba(124,92,255,0.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(0,217,192,0.12),transparent 40%);z-index:-1;}
header{position:sticky;top:0;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:100;}
header h1{font-size:1.1rem;font-weight:800;flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.icon-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem;}
.lang-bar{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto;}
.lang-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.search-wrap{padding:10px 18px 8px;}
.search-wrap input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem;outline:none;}
.progress-wrap{padding:0 18px 8px;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);}
.progress-bar{flex:1;height:5px;background:var(--card2);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .5s;}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 18px 18px;}
.subj-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 14px;cursor:pointer;transition:.3s;backdrop-filter:blur(10px);animation:fadeUp .5s backwards;}
.subj-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow);}
.subj-card .emoji{font-size:2rem;display:block;margin-bottom:8px;}
.subj-card h3{font-size:.95rem;font-weight:700;}
.subj-card p{font-size:.72rem;color:var(--muted);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.view{display:none;padding:0 18px;}
.view.active{display:block;}
.back-btn{background:var(--card2);border:1px solid var(--border);color:var(--accent2);cursor:pointer;font-size:.85rem;padding:9px 14px;font-weight:600;border-radius:10px;margin:12px 0;}
.chapter{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(10px);}
.chapter:hover{border-color:var(--accent2);transform:translateX(5px);}
.chapter h4{font-size:.9rem;font-weight:600;flex:1;}
.content-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;line-height:1.7;backdrop-filter:blur(10px);}
.content-box h3{font-size:1rem;margin:14px 0 8px;color:var(--accent2);}
.content-box h3:first-child{margin-top:0;}
.content-box h4{font-size:.9rem;margin:10px 0 5px;color:var(--accent);}
.content-box p,.content-box li{font-size:.88rem;margin-bottom:6px;}
.content-box ul{padding-left:20px;margin-bottom:10px;}
.content-box b{color:var(--accent2);}
.content-box .tip{background:rgba(255,217,61,0.1);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.85rem;}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:.8rem;white-space:nowrap;font-weight:600;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.mcq{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.mcq p{font-weight:600;margin-bottom:10px;font-size:.88rem;}
.opt{padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:.85rem;background:var(--card);}
.opt.correct{background:rgba(0,184,148,0.2);border-color:#00b894;font-weight:600;}
.opt.wrong{background:rgba(255,118,117,0.2);border-color:#ff7675;}
.quiz-score{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.quiz-score h3{font-size:1.4rem;margin-bottom:6px;color:var(--accent2);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 12px;z-index:100;}
.bottom-nav button{background:none;border:none;color:var(--muted);font-size:.65rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;padding:4px 14px;}
.bottom-nav button.active{color:var(--accent2);}
.bottom-nav span:first-child{font-size:1.25rem;}
@media(min-width:600px){.subjects{grid-template-columns:repeat(3,1fr);}}
</style>
</head>

<script>
var LANG='hinglish';
function t(o){return o[LANG]||o.hinglish;}

DATA.science={name:{hinglish:"Science",hindi:"विज्ञान",english:"Science"},emoji:"\uD83D\uDD2C",chapters:[
C("sci1",{hinglish:"Chemical Reactions & Equations",hindi:"रासायनिक अभिक्रियाएँ",english:"Chemical Reactions"},{hinglish:"<h3>Chemical Reaction</h3><p>Jab composition badalta hai.</p><h3>4 Signs</h3><ul><li>Gas nikalna</li><li>Temperature change</li><li>Colour change</li><li>Precipitate</li></ul><h3>5 Types</h3><h4>1. Combination</h4><p>CaO+H2O->Ca(OH)2</p><h4>2. Decomposition</h4><p>CaCO3->CaO+CO2</p><h4>3. Displacement</h4><p>Fe+CuSO4->FeSO4+Cu</p><h4>4. Double Displacement</h4><p>AgNO3+NaCl->AgCl+NaNO3</p><h4>5. Redox</h4><p>Oxidation+Reduction</p><div class='tip'>OIL RIG</div><h3>Corrosion & Rancidity</h3>",hindi:"<h3>रासायनिक अभिक्रिया</h3><p>संघटन बदलता है।</p><h3>4 संकेत</h3><ul><li>गैस</li><li>तापमान</li><li>रंग</li><li>अवक्षेप</li></ul><h3>5 प्रकार</h3><h4>1. संयोजन</h4><p>CaO+H2O->Ca(OH)2</p><h4>2. वियोजन</h4><p>CaCO3->CaO+CO2</p><h4>3. विस्थापन</h4><p>Fe+CuSO4->FeSO4+Cu</p><h4>4. द्वि-विस्थापन</h4><p>AgNO3+NaCl->AgCl+NaNO3</p><h4>5. रेडॉक्स</h4><p>ऑक्सीकरण+अपचयन</p><h3>संक्षारण, विकृतगंधिता</h3>",english:"<h3>Chemical Reaction</h3><p>Composition changes.</p><h3>4 Signs</h3><ul><li>Gas</li><li>Temp</li><li>Colour</li><li>Precipitate</li></ul><h3>5 Types</h3><h4>1. Combination</h4><p>CaO+H2O->Ca(OH)2</p><h4>2. Decomposition</h4><p>CaCO3->CaO+CO2</p><h4>3. Displacement</h4><p>Fe+CuSO4->FeSO4+Cu</p><h4>4. Double Displacement</h4><p>AgNO3+NaCl->AgCl+NaNO3</p><h4>5. Redox</h4><p>Oxidation+Reduction</p><h3>Corrosion, Rancidity</h3>"},{hinglish:"5 types, redox, corrosion, rancidity.",hindi:"5 प्रकार, रेडॉक्स, संक्षारण।",english:"5 types, redox, corrosion, rancidity."},[{q:{hinglish:"4 signs?",hindi:"4 संकेत?",english:"4 signs?"},a:{hinglish:"Gas, temp, colour, precipitate",hindi:"गैस, तापमान, रंग, अवक्षेप",english:"Gas, temp, colour, precipitate"}}],[{q:{hinglish:"CaO+H2O->?",hindi:"CaO+H2O->?",english:"CaO+H2O->?"},opts:["Decomp","Combination","Disp","Redox"],ans:1},{q:{hinglish:"Rust?",hindi:"जंग?",english:"Rust?"},opts:["FeO","Fe2O3.xH2O","Fe3O4","FeCl3"],ans:1}]),
C("sci2",{hinglish:"Acids, Bases & Salts",hindi:"अम्ल, क्षार, लवण",english:"Acids, Bases & Salts"},{hinglish:"<h3>Acid</h3><p>Khatta, blue litmus red, pH<7. HCl, H2SO4</p><h3>Base</h3><p>Kadwa, red litmus blue, pH>7. NaOH</p><h3>pH Scale</h3><p>0-14. <7 acid, 7 neutral, >7 base</p><h3>Neutralization</h3><p>HCl+NaOH->NaCl+H2O</p><h3>Acid+Metal</h3><p>Zn+H2SO4->ZnSO4+H2</p>",hindi:"<h3>अम्ल</h3><p>खट्टा, pH<7। HCl, H2SO4</p><h3>क्षार</h3><p>कड़वा, pH>7। NaOH</p><h3>pH स्केल</h3><p>0-14।</p><h3>उदासीनीकरण</h3><p>HCl+NaOH->NaCl+H2O</p><h3>अम्ल+धातु</h3><p>Zn+H2SO4->ZnSO4+H2</p>",english:"<h3>Acid</h3><p>Sour, pH<7.</p><h3>Base</h3><p>Bitter, pH>7.</p><h3>pH</h3><p>0-14.</p><h3>Neutralization</h3><p>HCl+NaOH->NaCl+H2O</p><h3>Acid+Metal</h3><p>Zn+H2SO4->ZnSO4+H2</p>"},{hinglish:"Acid-base, pH, neutralization.",hindi:"अम्ल-क्षार, pH।",english:"Acid-base, pH, neutralization."},[{q:{hinglish:"Acid vs Base?",hindi:"अम्ल बनाम क्षार?",english:"Acid vs Base?"},a:{hinglish:"Acid pH<7, Base pH>7",hindi:"अम्ल pH<7, क्षार pH>7",english:"Acid pH<7, Base pH>7"}}],[{q:{hinglish:"pH range?",hindi:"pH परास?",english:"pH range?"},opts:["0-7","7-14","0-14","1-10"],ans:2},{q:{hinglish:"Blue litmus red?",hindi:"नीला लिटमस लाल?",english:"Blue litmus red?"},opts:["Base","Acid","Salt","Water"],ans:1}]),
C("sci3",{hinglish:"Metals & Non-Metals",hindi:"धातु एवं अधातु",english:"Metals & Non-Metals"},{hinglish:"<h3>Metals</h3><p>Hard, shiny, malleable, conductor. Fe, Cu, Au</p><h3>Non-Metals</h3><p>Soft, dull, bad conductor. C, S, P</p><h3>Reactions</h3><p>Metal+O2->Basic oxide</p><p>Non-metal+O2->Acidic oxide</p><h3>Reactivity Series</h3><p>K>Na>Ca>Mg>Al>Zn>Fe>Pb>Cu>Hg>Ag>Au</p>",hindi:"<h3>धातु</h3><p>कठोर, सुचालक।</p><h3>अधातु</h3><p>मुलायम, कुचालक।</p><h3>अभिक्रियाएँ</h3><p>धातु+O2->क्षारीय ऑक्साइड</p><p>अधातु+O2->अम्लीय ऑक्साइड</p><h3>अभिक्रियाशीलता</h3><p>K>Na>Ca>Mg>Al>Zn>Fe>Pb>Cu>Hg>Ag>Au</p>",english:"<h3>Metals</h3><p>Hard, shiny, conductor.</p><h3>Non-Metals</h3><p>Soft, dull, bad conductor.</p><h3>Reactions</h3><p>Metal+O2->Basic</p><p>Non-metal+O2->Acidic</p><h3>Reactivity Series</h3><p>K>Na>Ca>Mg>Al>Zn>Fe>Pb>Cu>Hg>Ag>Au</p>"},{hinglish:"Properties, reactions, reactivity series.",hindi:"गुण, अभिक्रियाएँ, अभिक्रियाशीलता।",english:"Properties, reactions, reactivity series."},[{q:{hinglish:"Metal+O2?",hindi:"धातु+O2?",english:"Metal+O2?"},a:{hinglish:"Basic oxide. 2Mg+O2->2MgO",hindi:"क्षारीय ऑक्साइड।",english:"Basic oxide."}}],[{q:{hinglish:"Metal nahi?",hindi:"धातु नहीं?",english:"Not a metal?"},opts:["Iron","Copper","Sulphur","Gold"],ans:2},{q:{hinglish:"Top reactive?",hindi:"सर्वाधिक क्रियाशील?",english:"Top reactive?"},opts:["Gold","Potassium","Iron","Copper"],ans:1}]),
C("sci4",{hinglish:"Carbon & Its Compounds",hindi:"कार्बन एवं इसके यौगिक",english:"Carbon & Its Compounds"},{hinglish:"<h3>Carbon</h3><p>Tetravalent - 4 bonds banata hai. Catenation - chains.</p><h3>Allotropes</h3><ul><li>Diamond - hardest</li><li>Graphite - conductor</li><li>Fullerene - C60</li></ul><h3>Functional Groups</h3><ul><li>Alcohol -OH</li><li>Aldehyde -CHO</li><li>Ketone -CO-</li><li>Carboxylic -COOH</li></ul><h3>Homologous Series</h3><p>Same functional group, CH2 ka difference.</p><h3>Soaps & Detergents</h3>",hindi:"<h3>कार्बन</h3><p>चतुःसंयोजक। 4 बंध।</p><h3>अपरूप</h3><ul><li>हीरा - कठोरतम</li><li>ग्रेफाइट - सुचालक</li><li>फुलरीन - C60</li></ul><h3>क्रियात्मक समूह</h3><ul><li>एल्कोहॉल -OH</li><li>एल्डिहाइड -CHO</li><li>कीटोन -CO-</li><li>कार्बोक्सिलिक -COOH</li></ul><h3>समजातीय श्रेणी</h3><h3>साबुन, अपमार्जक</h3>",english:"<h3>Carbon</h3><p>Tetravalent, 4 bonds. Catenation.</p><h3>Allotropes</h3><ul><li>Diamond - hardest</li><li>Graphite - conductor</li><li>Fullerene - C60</li></ul><h3>Functional Groups</h3><ul><li>Alcohol -OH</li><li>Aldehyde -CHO</li><li>Ketone -CO-</li><li>Carboxylic -COOH</li></ul><h3>Homologous Series</h3><h3>Soaps & Detergents</h3>"},{hinglish:"Carbon compounds, allotropes, functional groups, soaps.",hindi:"कार्बन यौगिक, अपरूप, क्रियात्मक समूह।",english:"Carbon compounds, allotropes, functional groups, soaps."},[{q:{hinglish:"Diamond vs Graphite?",hindi:"हीरा बनाम ग्रेफाइट?",english:"Diamond vs Graphite?"},a:{hinglish:"Diamond hardest, graphite conductor.",hindi:"हीरा कठोरतम, ग्रेफाइट सुचालक।",english:"Diamond hardest, graphite conductor."}}],[{q:{hinglish:"Carboxylic acid group?",hindi:"कार्बोक्सिलिक समूह?",english:"Carboxylic group?"},opts:["-OH","-CHO","-COOH","-CO-"],ans:2},{q:{hinglish:"C60?",hindi:"C60?",english:"C60?"},opts:["Diamond","Graphite","Fullerene","Coal"],ans:2}]),
C("sci5",{hinglish:"Life Processes",hindi:"जैव प्रक्रम",english:"Life Processes"},{hinglish:"<h3>Nutrition</h3><p>Autotrophic - photosynthesis. Heterotrophic - others.</p><h3>Respiration</h3><p>Aerobic (O2) vs Anaerobic (no O2).</p><h3>Transportation</h3><p>Human heart 4 chambers. Xylem, phloem in plants.</p><h3>Excretion</h3><p>Kidney - nephron. Urine formation.</p>",hindi:"<h3>पोषण</h3><p>स्वपोषी - प्रकाश संश्लेषण। विषमपोषी।</p><h3>श्वसन</h3><p>वायवीय बनाम अवायवीय।</p><h3>परिवहन</h3><p>मानव हृदय 4 कक्ष। जाइलम, फ्लोएम।</p><h3>उत्सर्जन</h3><p>गुर्दा - नेफ्रॉन।</p>",english:"<h3>Nutrition</h3><p>Autotrophic - photosynthesis. Heterotrophic.</p><h3>Respiration</h3><p>Aerobic vs Anaerobic.</p><h3>Transportation</h3><p>Human heart 4 chambers. Xylem, phloem.</p><h3>Excretion</h3><p>Kidney - nephron.</p>"},{hinglish:"Nutrition, respiration, transportation, excretion.",hindi:"पोषण, श्वसन, परिवहन, उत्सर्जन।",english:"Nutrition, respiration, transportation, excretion."},[{q:{hinglish:"Heart chambers?",hindi:"हृदय कक्ष?",english:"Heart chambers?"},a:{hinglish:"4 chambers: 2 atria, 2 ventricles",hindi:"4 कक्ष: 2 अलिंद, 2 निलय",english:"4 chambers: 2 atria, 2 ventricles"}}],[{q:{hinglish:"Photosynthesis?",hindi:"प्रकाश संश्लेषण?",english:"Photosynthesis?"},opts:["O2 use","CO2 use","N2 use","H2 use"],ans:1},{q:{hinglish:"Kidney unit?",hindi:"गुर्दा इकाई?",english:"Kidney unit?"},opts:["Neuron","Nephron","Alveoli","Villi"],ans:1}]),
C("sci6",{hinglish:"Control & Coordination",hindi:"नियंत्रण एवं समन्वय",english:"Control & Coordination"},{hinglish:"<h3>Nervous System</h3><p>Neuron - structural unit. Brain, spinal cord.</p><h3>Reflex Action</h3><p>Sudden response. Spinal cord controls.</p><h3>Hormones</h3><ul><li>Thyroid - thyroxine</li><li>Pancreas - insulin</li><li>Adrenal - adrenaline</li><li>Pituitary - growth hormone</li></ul><h3>Plant Hormones</h3><p>Auxin, gibberellin, cytokinin, abscisic acid.</p>",hindi:"<h3>तंत्रिका तंत्र</h3><p>न्यूरॉन इकाई। मस्तिष्क, मेरुरज्जु।</p><h3>प्रतिवर्त क्रिया</h3><p>मेरुरज्जु नियंत्रित।</p><h3>हार्मोन</h3><ul><li>थायरॉइड - थायरॉक्सिन</li><li>अग्न्याशय - इंसुलिन</li><li>अधिवृक्क - एड्रेनालिन</li><li>पीयूष - वृद्धि</li></ul><h3>पादप हार्मोन</h3><p>ऑक्सिन, जिबरेलिन।</p>",english:"<h3>Nervous System</h3><p>Neuron. Brain, spinal cord.</p><h3>Reflex Action</h3><p>Spinal cord.</p><h3>Hormones</h3><ul><li>Thyroid - thyroxine</li><li>Pancreas - insulin</li><li>Adrenal - adrenaline</li><li>Pituitary - growth</li></ul><h3>Plant Hormones</h3><p>Auxin, gibberellin.</p>"},{hinglish:"Nervous system, hormones, plant hormones.",hindi:"तंत्रिका तंत्र, हार्मोन।",english:"Nervous system, hormones, plant hormones."},[{q:{hinglish:"Neuron?",hindi:"न्यूरॉन?",english:"Neuron?"},a:{hinglish:"Structural & functional unit of nervous system",hindi:"तंत्रिका तंत्र की इकाई",english:"Structural & functional unit"}}],[{q:{hinglish:"Insulin?",hindi:"इंसुलिन?",english:"Insulin?"},opts:["Thyroid","Pancreas","Adrenal","Pituitary"],ans:1},{q:{hinglish:"Reflex control?",hindi:"प्रतिवर्त नियंत्रण?",english:"Reflex control?"},opts:["Brain","Spinal cord","Heart","Lungs"],ans:1}]),
C("sci7",{hinglish:"How do Organisms Reproduce",hindi:"जीव जनन कैसे करते हैं",english:"How do Organisms Reproduce"},{hinglish:"<h3>Asexual</h3><ul><li>Fission - Amoeba</li><li>Budding - Yeast</li><li>Fragmentation - Spirogyra</li><li>Regeneration - Planaria</li><li>Vegetative - Potato</li></ul><h3>Sexual in Plants</h3><p>Stamen (male), Pistil (female). Pollination, fertilization.</p><h3>Human Reproduction</h3><p>Male: testes. Female: ovary. Fertilization in fallopian tube.</p><h3>Contraception</h3><p>Barrier, hormonal, surgical.</p>",hindi:"<h3>अलैंगिक</h3><ul><li>विखंडन - अमीबा</li><li>मुकुलन - यीस्ट</li><li>खंडन - स्पाइरोगाइरा</li><li>पुनरुद्भवन - प्लेनेरिया</li></ul><h3>पादप लैंगिक</h3><p>पुंकेसर, स्त्रीकेसर। परागण।</p><h3>मानव जनन</h3><p>पुरुष: वृषण। महिला: अंडाशय।</p><h3>गर्भनिरोध</h3><p>अवरोध, हार्मोनल, शल्य।</p>",english:"<h3>Asexual</h3><ul><li>Fission - Amoeba</li><li>Budding - Yeast</li><li>Fragmentation - Spirogyra</li><li>Regeneration - Planaria</li></ul><h3>Sexual in Plants</h3><p>Stamen, Pistil. Pollination.</p><h3>Human</h3><p>Male: testes. Female: ovary.</p><h3>Contraception</h3><p>Barrier, hormonal, surgical.</p>"},{hinglish:"Asexual, sexual, human reproduction, contraception.",hindi:"अलैंगिक, लैंगिक, मानव जनन।",english:"Asexual, sexual, human reproduction, contraception."},[{q:{hinglish:"Fission example?",hindi:"विखंडन उदाहरण?",english:"Fission example?"},a:{hinglish:"Amoeba",hindi:"अमीबा",english:"Amoeba"}}],[{q:{hinglish:"Yeast reproduces by?",hindi:"यीस्ट कैसे?",english:"Yeast by?"},opts:["Fission","Budding","Fragmentation","Regeneration"],ans:1},{q:{hinglish:"Fertilization site?",hindi:"निषेचन स्थल?",english:"Fertilization site?"},opts:["Uterus","Fallopian tube","Ovary","Vagina"],ans:1}]),
C("sci8",{hinglish:"Heredity & Evolution",hindi:"आनुवंशिकता एवं विकास",english:"Heredity & Evolution"},{hinglish:"<h3>Heredity</h3><p>Characters transfer from parents to offspring. Mendel's laws.</p><h3>Mendel's Experiment</h3><p>Pea plants. F1 - all tall. F2 - 3:1 ratio.</p><h3>Sex Determination</h3><p>XX - female, XY - male. Father decides.</p><h3>Evolution</h3><p>Darwin - natural selection. Lamarck - acquired characters.</p>",hindi:"<h3>आनुवंशिकता</h3><p>माता-पिता से संतान में। मेंडल के नियम।</p><h3>मेंडल प्रयोग</h3><p>मटर। F1 सभी लंबे। F2 3:1।</p><h3>लिंग निर्धारण</h3><p>XX मादा, XY नर। पिता तय करता।</p><h3>विकास</h3><p>डार्विन - प्राकृतिक चयन।</p>",english:"<h3>Heredity</h3><p>Traits from parents. Mendel's laws.</p><h3>Mendel</h3><p>Pea. F1 all tall. F2 3:1.</p><h3>Sex Determination</h3><p>XX female, XY male. Father decides.</p><h3>Evolution</h3><p>Darwin - natural selection.</p>"},{hinglish:"Heredity, Mendel, sex determination, evolution.",hindi:"आनुवंशिकता, मेंडल, विकास।",english:"Heredity, Mendel, sex determination, evolution."},[{q:{hinglish:"F2 ratio?",hindi:"F2 अनुपात?",english:"F2 ratio?"},a:{hinglish:"3:1 (tall:short)",hindi:"3:1 (लंबा:बौना)",english:"3:1"}}],[{q:{hinglish:"Male chromosomes?",hindi:"नर गुणसूत्र?",english:"Male chromosomes?"},opts:["XX","XY","YY","XO"],ans:1},{q:{hinglish:"Evolution theory?",hindi:"विकास सिद्धांत?",english:"Evolution theory?"},opts:["Lamarck","Darwin","Mendel","Newton"],ans:1}]),
C("sci9",{hinglish:"Light - Reflection & Refraction",hindi:"प्रकाश - परावर्तन एवं अपवर्तन",english:"Light - Reflection & Refraction"},{hinglish:"<h3>Reflection</h3><p>Angle i = angle r. Laws of reflection.</p><h3>Spherical Mirrors</h3><ul><li>Concave - converging</li><li>Convex - diverging</li></ul><h3>Mirror Formula</h3><p>1/v + 1/u = 1/f. Magnification m = -v/u</p><h3>Refraction</h3><p>Speed change when medium changes. Snell's law: sin i/sin r = n</p><h3>Lens Formula</h3><p>1/v - 1/u = 1/f. Power P = 1/f (dioptre)</p>",hindi:"<h3>परावर्तन</h3><p>आपतन कोण = परावर्तन कोण।</p><h3>गोलीय दर्पण</h3><ul><li>अवतल - अभिसारी</li><li>उत्तल - अपसारी</li></ul><h3>दर्पण सूत्र</h3><p>1/v + 1/u = 1/f</p><h3>अपवर्तन</h3><p>स्नेल नियम।</p><h3>लेंस सूत्र</h3><p>1/v - 1/u = 1/f. P=1/f</p>",english:"<h3>Reflection</h3><p>i = r.</p><h3>Mirrors</h3><ul><li>Concave - converging</li><li>Convex - diverging</li></ul><h3>Mirror Formula</h3><p>1/v + 1/u = 1/f</p><h3>Refraction</h3><p>Snell's law.</p><h3>Lens</h3><p>1/v - 1/u = 1/f. P=1/f</p>"},{hinglish:"Reflection, refraction, mirror & lens formulas.",hindi:"परावर्तन, अपवर्तन, सूत्र।",english:"Reflection, refraction, mirror & lens formulas."},[{q:{hinglish:"Mirror formula?",hindi:"दर्पण सूत्र?",english:"Mirror formula?"},a:{hinglish:"1/v + 1/u = 1/f",hindi:"1/v + 1/u = 1/f",english:"1/v + 1/u = 1/f"}}],[{q:{hinglish:"Concave mirror?",hindi:"अवतल दर्पण?",english:"Concave mirror?"},opts:["Diverging","Converging","Plane","None"],ans:1},{q:{hinglish:"Power unit?",hindi:"क्षमता इकाई?",english:"Power unit?"},opts:["Newton","Dioptre","Watt","Joule"],ans:1}]),
C("sci10",{hinglish:"Human Eye & Colourful World",hindi:"मानव नेत्र एवं रंगीन संसार",english:"Human Eye & Colourful World"},{hinglish:"<h3>Human Eye</h3><p>Cornea, iris, pupil, lens, retina.</p><h3>Defects</h3><ul><li>Myopia - near sighted, concave lens</li><li>Hypermetropia - far sighted, convex lens</li><li>Presbyopia - old age</li></ul><h3>Prism</h3><p>Dispersion - 7 colours (VIBGYOR).</p><h3>Scattering</h3><p>Sky blue - Rayleigh scattering. Red sunset.</p>",hindi:"<h3>नेत्र</h3><p>कॉर्निया, आइरिस, पुतली, लेंस, रेटिना।</p><h3>दोष</h3><ul><li>निकट दृष्टि - अवतल</li><li>दूर दृष्टि - उत्तल</li><li>जरा दृष्टि</li></ul><h3>प्रिज्म</h3><p>विक्षेपण - 7 रंग।</p><h3>प्रकीर्णन</h3><p>आकाश नीला।</p>",english:"<h3>Human Eye</h3><p>Cornea, iris, pupil, lens, retina.</p><h3>Defects</h3><ul><li>Myopia - concave</li><li>Hypermetropia - convex</li><li>Presbyopia</li></ul><h3>Prism</h3><p>Dispersion - 7 colours.</p><h3>Scattering</h3><p>Sky blue.</p>"},{hinglish:"Eye structure, defects, prism, scattering.",hindi:"नेत्र, दोष, प्रिज्म।",english:"Eye, defects, prism, scattering."},[{q:{hinglish:"Myopia lens?",hindi:"निकट दृष्टि लेंस?",english:"Myopia lens?"},a:{hinglish:"Concave lens",hindi:"अवतल लेंस",english:"Concave lens"}}],[{q:{hinglish:"7 colours?",hindi:"7 रंग?",english:"7 colours?"},opts:["VIBGYOR","RGB","CMYK","None"],ans:0},{q:{hinglish:"Sky blue due to?",hindi:"आकाश नीला क्यों?",english:"Sky blue due to?"},opts:["Reflection","Scattering","Refraction","Dispersion"],ans:1}]),
C("sci11",{hinglish:"Electricity",hindi:"विद्युत",english:"Electricity"},{hinglish:"<h3>Current</h3><p>I = Q/t. Unit: Ampere.</p><h3>Ohm's Law</h3><p>V = IR. R = resistance.</p><h3>Series & Parallel</h3><p>Series: R = R1+R2. Parallel: 1/R = 1/R1+1/R2</p><h3>Heating Effect</h3><p>H = I²Rt. Joule's law.</p><h3>Power</h3><p>P = VI = I²R = V²/R. Unit: Watt.</p>",hindi:"<h3>धारा</h3><p>I=Q/t. एम्पियर।</p><h3>ओम नियम</h3><p>V=IR</p><h3>श्रेणी और समांतर</h3><p>श्रेणी: R=R1+R2. समांतर: 1/R=1/R1+1/R2</p><h3>ताप प्रभाव</h3><p>H=I²Rt</p><h3>शक्ति</h3><p>P=VI. वाट।</p>",english:"<h3>Current</h3><p>I=Q/t. Ampere.</p><h3>Ohm's Law</h3><p>V=IR</p><h3>Series & Parallel</h3><p>Series: R=R1+R2. Parallel: 1/R=1/R1+1/R2</p><h3>Heating</h3><p>H=I²Rt</p><h3>Power</h3><p>P=VI. Watt.</p>"},{hinglish:"Ohm's law, series-parallel, heating, power.",hindi:"ओम नियम, श्रेणी-समांतर, शक्ति।",english:"Ohm's law, series-parallel, heating, power."},[{q:{hinglish:"Ohm's law?",hindi:"ओम नियम?",english:"Ohm's law?"},a:{hinglish:"V = IR",hindi:"V = IR",english:"V = IR"}}],[{q:{hinglish:"Series resistance?",hindi:"श्रेणी प्रतिरोध?",english:"Series resistance?"},opts:["R1+R2","R1*R2","1/(R1+R2)","R1-R2"],ans:0},{q:{hinglish:"Power unit?",hindi:"शक्ति इकाई?",english:"Power unit?"},opts:["Volt","Ampere","Watt","Ohm"],ans:2}]),
C("sci12",{hinglish:"Magnetic Effects of Electric Current",hindi:"विद्युत धारा के चुम्बकीय प्रभाव",english:"Magnetic Effects of Electric Current"},{hinglish:"<h3>Magnetic Field</h3><p>Current carrying conductor field banata hai.</p><h3>Right Hand Thumb Rule</h3><p>Thumb - current, fingers - field.</p><h3>Solenoid</h3><p>Electromagnet. Uniform field.</p><h3>Force on Conductor</h3><p>Fleming's Left Hand Rule. Motor principle.</p><h3>Induction</h3><p>Fleming's Right Hand Rule. Generator principle.</p>",hindi:"<h3>चुम्बकीय क्षेत्र</h3><p>धारावाही चालक क्षेत्र बनाता।</p><h3>दक्षिण हस्त अंगुष्ठ नियम</h3><h3>परिनालिका</h3><p>विद्युत चुम्बक।</p><h3>बल</h3><p>फ्लेमिंग का वाम हस्त नियम।</p><h3>प्रेरण</h3><p>फ्लेमिंग का दक्षिण हस्त।</p>",english:"<h3>Magnetic Field</h3><p>Current creates field.</p><h3>Right Hand Thumb Rule</h3><h3>Solenoid</h3><p>Electromagnet.</p><h3>Force</h3><p>Fleming's Left Hand.</p><h3>Induction</h3><p>Fleming's Right Hand.</p>"},{hinglish:"Magnetic field, rules, solenoid, induction.",hindi:"चुम्बकीय क्षेत्र, नियम।",english:"Magnetic field, rules, solenoid, induction."},[{q:{hinglish:"Motor rule?",hindi:"मोटर नियम?",english:"Motor rule?"},a:{hinglish:"Fleming's Left Hand Rule",hindi:"फ्लेमिंग का वाम हस्त",english:"Fleming's Left Hand Rule"}}],[{q:{hinglish:"Solenoid makes?",hindi:"परिनालिका?",english:"Solenoid makes?"},opts:["Magnet","Electromagnet","Motor","Generator"],ans:1},{q:{hinglish:"Generator rule?",hindi:"जनित्र नियम?",english:"Generator rule?"},opts:["Left hand","Right hand","Ohm","Joule"],ans:1}]),

C("eng6",{hinglish:"Glimpses of India",hindi:"भारत की झलक",english:"Glimpses of India"},{hinglish:"<h3>Part 1: A Baker from Goa</h3><p>Goan bread makers. Portuguese influence. Pader.</p><h3>Part 2: Coorg</h3><p>Karnataka. Coffee, spices. Kodavu people. Brave.</p><h3>Part 3: Tea from Assam</h3><p>Assam tea gardens. Rajvir, Pranjol. Legend of Bodhidharma.</p>",hindi:"<h3>भाग 1: गोवा के बेकर</h3><p>पुर्तगाली प्रभाव।</p><h3>भाग 2: कुर्ग</h3><p>कर्नाटक। कॉफी।</p><h3>भाग 3: असम की चाय</h3><p>चाय बागान। बोधिधर्म।</p>",english:"<h3>Part 1: Baker from Goa</h3><p>Portuguese influence.</p><h3>Part 2: Coorg</h3><p>Karnataka. Coffee.</p><h3>Part 3: Tea from Assam</h3><p>Tea gardens. Bodhidharma legend.</p>"},{hinglish:"Goa, Coorg, Assam - India's diversity.",hindi:"गोवा, कुर्ग, असम।",english:"Goa, Coorg, Assam - diversity of India."},[{q:{hinglish:"Coorg kahan?",hindi:"कुर्ग कहाँ?",english:"Coorg where?"},a:{hinglish:"Karnataka",hindi:"कर्नाटक",english:"Karnataka"}}],[{q:{hinglish:"Tea from?",hindi:"चाय कहाँ?",english:"Tea from?"},opts:["Goa","Coorg","Assam","Kerala"],ans:2},{q:{hinglish:"Goa specialty?",hindi:"गोवा?",english:"Goa?"},opts:["Tea","Bread","Coffee","Silk"],ans:1}]),
C("eng7",{hinglish:"Mijbil the Otter",hindi:"मिजबिल ऊदबिलाव",english:"Mijbil the Otter"},{hinglish:"<h3>Author: Gavin Maxwell</h3><p>Theme: Human-animal bond.</p><h3>Summary</h3><p>Author got otter Mijbil in Iraq. Brought to London. Mij playful, clever. Loved water, played with ball.</p><h3>Message</h3><p>Empathy towards animals.</p>",hindi:"<h3>लेखक: गैविन मैक्सवेल</h3><p>विषय: मानव-पशु बंधन।</p><h3>सारांश</h3><p>लेखक ने इराक में ऊदबिलाव पाला। लंदन लाए। खेलप्रिय।</p>",english:"<h3>Author: Gavin Maxwell</h3><p>Theme: Human-animal bond.</p><h3>Summary</h3><p>Author got otter Mijbil in Iraq. Brought to London. Playful, clever.</p>"},{hinglish:"Mijbil otter, human-animal bond.",hindi:"मिजबिल, बंधन।",english:"Mijbil otter, human-animal bond."},[{q:{hinglish:"Mijbil kaun?",hindi:"मिजबिल?",english:"Mijbil?"},a:{hinglish:"Otter pet of author",hindi:"लेखक का ऊदबिलाव",english:"Otter pet of author"}}],[{q:{hinglish:"Mijbil kahan se?",hindi:"मिजबिल कहाँ से?",english:"Mijbil from?"},opts:["Iraq","India","China","Egypt"],ans:0},{q:{hinglish:"Mijbil pasand?",hindi:"मिजबिल पसंद?",english:"Mijbil likes?"},opts:["Fire","Water","Sand","Ice"],ans:1}]),
C("eng8",{hinglish:"Madam Rides the Bus",hindi:"मैडम बस में",english:"Madam Rides the Bus"},{hinglish:"<h3>Author: Vallikkannan</h3><p>Theme: Curiosity, growing up.</p><h3>Summary</h3><p>Valli - 8 year old girl. Wanted bus ride. Saved money. Rode alone. Saw world, returned. Fond memory.</p><h3>Characters</h3><ul><li>Valli - curious, determined</li><li>Conductor - friendly</li></ul>",hindi:"<h3>लेखक: वल्लिक्कन्नन</h3><p>विषय: जिज्ञासा।</p><h3>सारांश</h3><p>वल्ली 8 साल। बस यात्रा। पैसे बचाए। अकेले गई।</p>",english:"<h3>Author: Vallikkannan</h3><p>Theme: Curiosity, growing up.</p><h3>Summary</h3><p>Valli - 8 year old. Wanted bus ride. Saved money. Rode alone.</p>"},{hinglish:"Valli's bus journey, curiosity.",hindi:"वल्ली की यात्रा।",english:"Valli's bus journey, curiosity."},[{q:{hinglish:"Valli ki age?",hindi:"वल्ली की उम्र?",english:"Valli's age?"},a:{hinglish:"8 years",hindi:"8 साल",english:"8 years"}}],[{q:{hinglish:"Valli kya chahti?",hindi:"वल्ली क्या?",english:"Valli wanted?"},opts:["Bus ride","Train","Plane","Boat"],ans:0},{q:{hinglish:"Kis ne help?",hindi:"किसने मदद?",english:"Who helped?"},opts:["Driver","Conductor","Mother","Father"],ans:1}]),
C("eng9",{hinglish:"The Sermon at Benares",hindi:"बनारस का उपदेश",english:"The Sermon at Benares"},{hinglish:"<h3>Author: Betty Renshaw</h3><p>Theme: Death, wisdom.</p><h3>Summary</h3><p>Gautam Buddha. Kisa Gotami's son died. Buddha asked for mustard seeds from house where no one died. She realized death is universal.</p><h3>Message</h3><p>Death is common to all. Grief doesn't bring back.</p>",hindi:"<h3>लेखक: बेट्टी रेनशॉ</h3><p>विषय: मृत्यु, ज्ञान।</p><h3>सारांश</h3><p>गौतम बुद्ध। किसा गोतमी का बेटा मरा। बुद्ध ने सरसों माँगी।</p><h3>संदेश</h3><p>मृत्यु सार्वभौमिक।</p>",english:"<h3>Author: Betty Renshaw</h3><p>Theme: Death, wisdom.</p><h3>Summary</h3><p>Gautam Buddha. Kisa Gotami's son died. Buddha asked for mustard seeds. She realized death is universal.</p>"},{hinglish:"Buddha's sermon, Kisa Gotami, death.",hindi:"बुद्ध, किसा गोतमी।",english:"Buddha's sermon, Kisa Gotami, death."},[{q:{hinglish:"Kisa Gotami kaun?",hindi:"किसा गोतमी?",english:"Kisa Gotami?"},a:{hinglish:"Woman whose son died",hindi:"जिसका बेटा मरा",english:"Woman whose son died"}}],[{q:{hinglish:"Buddha ne kya maanga?",hindi:"बुद्ध ने?",english:"Buddha asked?"},opts:["Rice","Mustard seeds","Flowers","Water"],ans:1},{q:{hinglish:"Message?",hindi:"संदेश?",english:"Message?"},opts:["Life","Death universal","Money","Love"],ans:1}]),
C("eng10",{hinglish:"The Proposal",hindi:"प्रस्ताव",english:"The Proposal"},{hinglish:"<h3>Author: Anton Chekhov</h3><p>Theme: Marriage, satire.</p><h3>Summary</h3><p>Lomov proposes to Natalya. Argument over Oxen Meadows, dogs. Finally agrees. Comedy of manners.</p><h3>Characters</h3><ul><li>Lomov - nervous suitor</li><li>Natalya - quarrelsome</li><li>Chubukov - father</li></ul>",hindi:"<h3>लेखक: एंटन चेखव</h3><p>विषय: विवाह, व्यंग्य।</p><h3>सारांश</h3><p>लोमोव नताल्या को प्रस्ताव। बहस। अंत में सहमति।</p>",english:"<h3>Author: Anton Chekhov</h3><p>Theme: Marriage, satire.</p><h3>Summary</h3><p>Lomov proposes to Natalya. Argument over land, dogs. Finally agrees.</p>"},{hinglish:"Marriage proposal, arguments, satire.",hindi:"प्रस्ताव, बहस।",english:"Marriage proposal, arguments, satire."},[{q:{hinglish:"Author?",hindi:"लेखक?",english:"Author?"},a:{hinglish:"Anton Chekhov",hindi:"एंटन चेखव",english:"Anton Chekhov"}}],[{q:{hinglish:"Kis ne propose?",hindi:"किसने प्रस्ताव?",english:"Who proposed?"},opts:["Lomov","Chubukov","Natalya","None"],ans:0},{q:{hinglish:"Jhagda kis par?",hindi:"झगड़ा?",english:"Argument on?"},opts:["Money","Land","Food","Water"],ans:1}])
]};
var curSub=null,curCh=null,curTab=0;
var bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]');
var progress=JSON.parse(localStorage.getItem('progress')||'[]');
function saveData(){localStorage.setItem('bookmarks',JSON.stringify(bookmarks));localStorage.setItem('progress',JSON.stringify(progress));updateProgress();}
function updateProgress(){var total=0,done=0;Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){total++;if(progress.indexOf(c.id)>-1)done++;});});var pct=total?Math.round((done/total)*100):0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressText').innerText=pct+'%';}
function renderSubjects(){document.getElementById('subjectGrid').innerHTML=Object.keys(DATA).map(function(k,i){return '<div class="subj-card" style="animation-delay:'+(i*0.05)+'s" onclick="openSubject(\''+k+'\')"><span class="emoji">'+DATA[k].emoji+'</span><h3>'+t(DATA[k].name)+'</h3><p>'+DATA[k].chapters.length+' chapters</p></div>';}).join('');updateProgress();}
function openSubject(k){curSub=k;document.getElementById('subjTitle').innerText=DATA[k].emoji+' '+t(DATA[k].name);document.getElementById('chapterList').innerHTML=DATA[k].chapters.map(function(c){var d=progress.indexOf(c.id)>-1;return '<div class="chapter" onclick="openChapter(\''+c.id+'\')"><h4>'+t(c.title)+'</h4>'+(d?'<span style="color:var(--accent2);">&#10004;</span>':'')+'<span>&#8594;</span></div>';}).join('');showView('subjectView');}
function openChapter(id){var ch=DATA[curSub].chapters.find(function(c){return c.id===id;});curCh=ch;document.getElementById('chapterTitle').innerText=t(ch.title);curTab=0;document.querySelectorAll('.tab').forEach(function(t2,i){t2.classList.toggle('active',i===0);});var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';if(progress.indexOf(ch.id)===-1){progress.push(ch.id);saveData();}renderTab();showView('notesView');}
function switchTab(i,el){curTab=i;document.querySelectorAll('.tab').forEach(function(t2){t2.classList.remove('active');});el.classList.add('active');renderTab();}
function renderTab(){var ch=curCh,b=document.getElementById('tabContent');
if(curTab===0){b.innerHTML='<div class="content-box">'+t(ch.notes)+'</div>';}
else if(curTab===1){b.innerHTML='<div class="content-box"><h3>Summary</h3><p>'+t(ch.summary)+'</p></div>';}
else if(curTab===2){b.innerHTML='<div class="content-box">'+(ch.questions.length?ch.questions.map(function(q,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+t(q.q)+'</p><details><summary style="color:var(--accent2);cursor:pointer;">Answer</summary><p>'+t(q.a)+'</p></details></div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===3){b.innerHTML='<div class="content-box">'+(ch.mcqs.length?ch.mcqs.map(function(m,i){return '<div class="mcq"><p>Q'+(i+1)+'. '+t(m.q)+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="this.classList.add('+(j===m.ans?"'correct'":"'wrong'")+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('')+'</div>';}).join(''):'Jald aayega...')+'</div>';}
else if(curTab===4){renderQuiz();}}
function renderQuiz(){var ch=curCh,b=document.getElementById('tabContent');if(!ch.mcqs.length){b.innerHTML='<div class="content-box">Quiz jald aayega...</div>';return;}var score=0;var total=ch.mcqs.length;b.innerHTML='<div class="quiz-score"><h3>&#127942; Quiz</h3><p>'+total+' questions</p></div><div class="content-box" id="quizBox"></div>';var qb=document.getElementById('quizBox');function showQ(idx){if(idx>=total){var pct=Math.round((score/total)*100);qb.innerHTML='<div style="text-align:center;padding:20px;"><h3 style="color:var(--accent2);font-size:2rem;">'+score+'/'+total+'</h3><p style="color:var(--muted);margin:10px 0;">'+pct+'%</p><button class="back-btn" onclick="renderQuiz()">Try Again</button></div>';return;}var m=ch.mcqs[idx];qb.innerHTML='<p style="font-weight:600;margin-bottom:12px;">Q'+(idx+1)+'. '+t(m.q)+'</p>'+m.opts.map(function(o,j){return '<div class="opt" onclick="checkQ(this,'+(j===m.ans)+','+idx+')">'+String.fromCharCode(65+j)+'. '+o+'</div>';}).join('');}window.checkQ=function(el,correct,idx){el.classList.add(correct?'correct':'wrong');if(correct)score++;setTimeout(function(){showQ(idx+1);},800);};showQ(0);}
function toggleBookmark(){var ch=curCh;var idx=bookmarks.indexOf(ch.id);if(idx>-1){bookmarks.splice(idx,1);}else{bookmarks.push(ch.id);}var b=document.getElementById('bookmarkBtn');b.innerHTML=bookmarks.indexOf(ch.id)>-1?'&#9733;':'&#9734;';b.style.color=bookmarks.indexOf(ch.id)>-1?'var(--gold)':'var(--muted)';saveData();}
function showView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.remove('active');});if(id==='home')document.getElementById('navHome').classList.add('active');if(id==='bookmarksView')document.getElementById('navSaved').classList.add('active');}
function goHome(){showView('home');}
function goBack(){curSub?openSubject(curSub):goHome();}
function showBookmarks(){var list=document.getElementById('bookmarksList');if(!bookmarks.length){list.innerHTML='<p style="text-align:center;color:var(--muted);padding:20px;">Kuch save nahi kiya</p>';}else{var html='';Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(bookmarks.indexOf(c.id)>-1){html+='<div class="chapter" onclick="openSubject(\''+k+'\');setTimeout(function(){openChapter(\''+c.id+'\');},100)"><h4>'+t(c.title)+'</h4><span>'+DATA[k].emoji+'</span></div>';}});});list.innerHTML=html;}showView('bookmarksView');}
function search(){var q=document.getElementById('searchBox').value.toLowerCase();if(!q){renderSubjects();return;}var g=document.getElementById('subjectGrid');var r=[];Object.keys(DATA).forEach(function(k){DATA[k].chapters.forEach(function(c){if(t(c.title).toLowerCase().indexOf(q)>-1)r.push({s:k,c:c});});});g.innerHTML=r.length?r.map(function(x){return '<div class="subj-card" onclick="openSubject(\''+x.s+'\');setTimeout(function(){openChapter(\''+x.c.id+'\');},100)"><span class="emoji">'+DATA[x.s].emoji+'</span><h3>'+t(x.c.title)+'</h3><p>'+t(DATA[x.s].name)+'</p></div>';}).join(''):'<p style="text-align:center;color:var(--muted);padding:20px;">Kuch nahi mila</p>';}
function setLang(l,el){LANG=l;document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');renderSubjects();if(curSub)openSubject(curSub);if(curCh)renderTab();}
renderSubjects();
</script>
</body>
